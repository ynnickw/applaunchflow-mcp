name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  workflow_dispatch:

concurrency:
  group: mcp-registry-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest version
        run: node --test scripts/registry-manifest.test.mjs

      - name: Install MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          release="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "${archive}" "${release}/${archive}"
          curl --fail --location --silent --show-error --output checksums.txt "${release}/registry_1.8.1_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          tar -xzf "${archive}" mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish remote server
        run: ./mcp-publisher publish server.json
