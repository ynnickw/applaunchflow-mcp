name: Release npm and MCP Registry

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test package
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Detect version increase
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current_version=$(node -p "require('./package.json').version")
          if ! git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            echo "Unable to read package.json at the previous push commit: ${BEFORE_SHA}" >&2
            exit 1
          fi
          previous_version=$(git show "${BEFORE_SHA}:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));")
          if node scripts/release-version.mjs "${previous_version}" "${current_version}"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "previous_version=${previous_version}" >> "$GITHUB_OUTPUT"
          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"

      - name: Report unchanged version
        if: steps.version.outputs.should_publish != 'true'
        run: echo "Skipping npm publish because package version did not increase (${{ steps.version.outputs.previous_version }} -> ${{ steps.version.outputs.current_version }})."

      - name: Check registry
        if: steps.version.outputs.should_publish == 'true'
        id: registry
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true' && steps.registry.outputs.already_published != 'true'
        run: npm publish --provenance --access public

      - name: Verify npm publication
        if: steps.version.outputs.should_publish == 'true'
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for _ in 1 2 3 4 5; do
            if [ "$(npm view "${package}@${version}" version 2>/dev/null)" = "${version}" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "npm did not expose ${package}@${version} after publication" >&2
          exit 1

      - name: Validate MCP Registry manifest
        if: steps.version.outputs.should_publish == 'true'
        run: node --test scripts/registry-manifest.test.mjs

      - name: Install MCP Registry publisher
        if: steps.version.outputs.should_publish == 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          release="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "${archive}" "${release}/${archive}"
          curl --fail --location --silent --show-error --output checksums.txt "${release}/registry_1.8.1_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          tar -xzf "${archive}" mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate with GitHub OIDC
        if: steps.version.outputs.should_publish == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.version.outputs.should_publish == 'true'
        run: ./mcp-publisher publish server.json
